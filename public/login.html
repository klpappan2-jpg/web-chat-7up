  <main class="stage">
    <div class="win-wrap">
      <section class="win" aria-labelledby="title">
        <div class="title-bar">
          <h1 id="title">7up chat</h1>
          <span class="badge">NO EMAIL!</span>
        </div>

        <div class="win-body">
          <p class="tag">Pick a name &amp; password. Pop in!</p>

          <div class="tabs">
            <button id="tabUp" class="on" type="button">Sign up</button>
            <button id="tabIn" type="button">Log in</button>
          </div>

          <label for="name">Name</label>
          <input id="name" autocomplete="username" maxlength="16">

          <label for="pass">Password</label>
          <input id="pass" type="password" autocomplete="current-password" maxlength="128">

          <button id="go" type="button">Create account</button>
          <p id="msg" role="alert"></p>
        </div>
      </section>
    </div>
  </main>
